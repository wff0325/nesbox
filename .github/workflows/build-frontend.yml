name: Build Frontend

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build webapp
        run: |
          # 进入前端目录执行构建
          cd packages/webapp
          yarn build

      - name: Package Dist
        run: |
          cd packages/webapp
          # 检查打包生成的静态目录（通常是 dist 或 build）
          if [ -d "dist" ]; then
            cd dist && zip -r ../../../frontend.zip .
          elif [ -d "build" ]; then
            cd build && zip -r ../../../frontend.zip .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-files
          path: frontend.zip
